nge(trials):\n        run = flips = 0\n        while run < n:\n            flips += 1\n            run = run + 1 if random.random() < 0.5 else 0\n        total += flips\n    return total / trials\n\nassert expected_run(2) == 6 and expected_run(3) == 14\nassert abs(simulate(2) - 6) < 0.1\nprint(\"连续两次正面期望 6 次\")\n"}, "lists": [], "check": "ok"}, "puzzle-dice-until-6": {"id": "智24", "slug": "puzzle-dice-until-6", "title": "掷骰子直到出 6 / 集齐 6 个面的期望", "diff": "EASY", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目 1】掷骰子直到出现 6，期望掷几次？\n【答案 1】6 次。每次成功概率 p = 1/6，等待第一次成功是几何分布，期望 1/p = 6。\n【题目 2】掷骰子直到 1–6 每个点数都至少出现一次，期望掷几次？\n【答案 2】6 × (1 + 1/2 + 1/3 + 1/4 + 1/5 + 1/6) = 14.7 次。\n【思路】把过程分成 6 段：已经集齐 k 种以后，下一次掷出新点数的概率是 (6−k)/6，这一段的期望等待次数是 6/(6−k)。\n【思路】依次是 6/6, 6/5, 6/4, 6/3, 6/2, 6/1，加起来就是 14.7。\n【推广】n 种“优惠券”全部集齐，期望次数是 n·H_n ≈ n·ln n。\n【面试这样说】“几何分布期望 1/p。集齐问题按‘已经有 k 种’分段，每段是一个几何分布，加起来是 6 乘调和数。”\n【出处】经典期望题", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\nfrom fractions import Fraction\n\ncoupon = sum(Fraction(6, 6 - k) for k in range(6))\nassert coupon == Fraction(147, 10)\n\ndef sim():\n    seen, n = set(), 0\n    while len(seen) < 6:\n        seen.add(random.randint(1, 6)); n += 1\n    return n\n\navg = sum(sim() for _ in range(100_000)) / 100_000\nassert abs(avg - 14.7) < 0.1\nprint(\"集齐 6 面期望\", float(coupon), \"次\")\n"}, "lists": [], "check": "ok"}, "puzzle-birthday": {"id": "智25", "slug": "puzzle-birthday", "title": "多少人时至少两人同一天生日的概率超过一半", "diff": "EASY", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目】一年按 365 天算，每人生日等可能。最少多少人时，“至少两人同一天生日”的概率超过 50%？\n【答案】23 人，概率约 50.7%。\n【思路】1. 直接算“至少两人同天”很麻烦，先算反面：“所有人生日都不同”。\n【思路】2. 第 1 人随便，第 2 人和他不同的概率是 364/365，第 3 人和前两人都不同是 363/365……\n【思路】3. 所以 P(全部不同) = 365/365 × 364/365 × … × (365−n+1)/365，答案是 1 − 这个值。n=23 时第一次低于 0.5。\n【直觉】23 人有 23×22/2 = 253 对人，每对同生日的概率是 1/365，配对数量多才是关键。\n【近似】P(至少两人同天) ≈ 1 − exp(−n(n−1)/730)。\n【常见错误】答 183（365 的一半），这是在想“和我同生日”，不是“任意两人同生日”。\n【面试这样说】“算补集：全部不同的概率连乘，23 人时补集概率超过一半；直觉上是因为两两配对的数量是平方级。”\n【出处】经典概率题", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "def p_shared(n):\n    p = 1.0\n    for i in range(n):\n        p *= (365 - i) / 365\n    return 1 - p\n\nn = next(k for k in range(1, 100) if p_shared(k) > 0.5)\nassert n == 23\nprint(n, \"人时概率\", round(p_shared(n), 4))\n"}, "lists": [], "check": "ok"}, "puzzle-stick-triangle": {"id": "智26", "slug": "puzzle-stick-triangle", "title": "一根棍子随机折两刀，能组成三角形的概率", "diff": "MEDIUM", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目】长度为 1 的棍子上均匀随机取两个点切开，得到三段。三段能组成三角形的概率是多少？\n【答案】1/4。\n【思路】1. 三段能组成三角形，当且仅当每一段都小于 1/2（任意一段小于另外两段之和，等价于小于总长的一半）。\n【思路】2. 设两个切点为 x、y，它们在单位正方形中均匀分布。先看 x<y 的一半（面积 1/2）：三段是 x, y−x, 1−y。\n【思路】3. 条件 x<1/2、y−x<1/2、y>1/2 在这一半中围成一个小三角形，面积是 1/8。\n【思路】4. 概率 = 1/8 ÷ 1/2 = 1/4（x>y 的一半对称）。\n【追问】先随机折一刀，再把较长的一段随机折一刀，概率变成 2ln2 − 1 ≈ 0.386。圆上随机取 3 点，三角形包含圆心的概率也是 1/4。\n【面试这样说】“三角形条件等价于每段都小于一半，在单位正方形里画出这个区域，面积占 1/4。”\n【出处】量化面试经典", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\n\ndef ok():\n    a, b = sorted((random.random(), random.random()))\n    return max(a, b - a, 1 - b) < 0.5\n\nn = 200_000\np = sum(ok() for _ in range(n)) / n\nassert abs(p - 0.25) < 0.01\nprint(\"模拟概率 ≈\", round(p, 3))\n"}, "lists": [], "check": "ok"}, "puzzle-ants-pole": {"id": "智27", "slug": "puzzle-ants-pole", "title": "杆上蚂蚁相撞后掉头，最晚何时全部掉下", "diff": "MEDIUM", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目】一根长 L 的杆上有若干只蚂蚁，每只随机朝左或朝右以速度 1 爬行，两只蚂蚁相撞后都立刻掉头，爬到端点就掉下去。所有蚂蚁掉下去最多需要多久？\n【答案】等于“假设蚂蚁不会相撞、各自一直沿原方向走到端点”所需时间的最大值。\n【思路】1. 两只蚂蚁相撞后都掉头，从外面看，和“两只蚂蚁直接穿过对方继续走”完全一样，只是两只蚂蚁的身份互换了。\n【思路】2. 所以整体上“某个位置有一只蚂蚁向某方向走”的事件和不相撞时完全相同，掉下去的时刻集合也相同。\n【思路】3. 向右走的蚂蚁需要 L − 位置，向左走的需要 位置，取最大值即可。\n【追问】最少需要多久？每只蚂蚁自己选方向时，取 max(各蚂蚁到较近端点的距离)。LeetCode 1503 是这道题。\n【面试这样说】“相撞掉头等价于互相穿过、只交换名字，所以直接按不相撞计算每只蚂蚁走到端点的时间，取最大值。”\n【出处】经典题；LeetCode 1503", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\n\ndef by_trick(pos, dirs, L):\n    return max(L - p if d > 0 else p for p, d in zip(pos, dirs))\n\ndef by_sim(pos, dirs, L, dt=0.5):           # 位置取整数，用 0.5 步长模拟相撞后掉头\n    ants, t = [[p, d] for p, d in zip(pos, dirs)], 0\n    while ants:\n        for a in ants: a[0] += a[1] * dt\n        t += dt\n        ants.sort()\n        for i in range(len(ants) - 1):\n            if ants[i][0] == ants[i + 1][0] and ants[i][1] > 0 > ants[i + 1][1]:\n                ants[i][1], ants[i + 1][1] = -1, 1\n        ants = [a for a in ants if 0 < a[0] < L]\n    return t\n\nfor _ in range(300):\n    L = 20\n    pos = random.sample(range(1, L), 6)\n    dirs = [random.choice((-1, 1)) for _ in pos]\n    assert by_sim(pos, dirs, L) == by_trick(pos, dirs, L)\nprint(\"相撞掉头等价于互相穿过\")\n"}, "lists": [], "check": "ok"}, "puzzle-sum-exceeds-one": {"id": "智28", "slug": "puzzle-sum-exceeds-one", "title": "不断取 [0,1] 均匀随机数，和超过 1 时停止，期望取几个", "diff": "MEDIUM", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目】不断从 [0, 1] 中取均匀随机数并累加，总和第一次超过 1 时停止。期望要取几个数？\n【答案】e ≈ 2.718。\n【思路】1. 设 N 是取的个数。期望可以写成 E[N] = Σ(n≥0) P(N > n)。\n【思路】2. N > n，等价于前 n 个数之和仍不超过 1。\n【思路】3. n 个 [0, 1] 均匀随机数之和不超过 1 的概率，等于 n 维单纯形的体积，即 1/n!。\n【思路】4. 所以 E[N] = Σ 1/n! = 1 + 1 + 1/2! + 1/3! + … = e。\n【追问】如果是超过 t（0 ≤ t ≤ 1），期望是 e^t。\n【面试这样说】“用 E[N] = ΣP(N > n)，前 n 个数和不超过 1 的概率是单纯形体积 1/n!，求和得到 e。”\n【出处】量化面试经典", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import math, random\n\ndef once():\n    s = n = 0\n    while s <= 1:\n        s += random.random(); n += 1\n    return n\n\navg = sum(once() for _ in range(200_000)) / 200_000\nassert abs(avg - math.e) < 0.02\nprint(\"模拟\", round(avg, 3), \"≈ e\")\n"}, "lists": [], "check": "ok"}, "puzzle-jokers-same-pile": {"id": "智29", "slug": "puzzle-jokers-same-pile", "title": "54 张牌平分 3 堆，大小王在同一堆的概率", "diff": "EASY", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目】一副 54 张牌（含大小王）随机平均分成 3 堆，每堆 18 张。大王和小王在同一堆的概率是多少？\n【答案】17/53。\n【思路】1. 先不管大王在哪一堆，它所在的那一堆还剩 17 个位置。\n【思路】2. 小王在剩下的 53 个位置中等可能出现。\n【思路】3. 所以小王落在大王那一堆的概率是 17/53。\n【技巧】先固定一个对象，再看另一个对象的条件概率，可以避免复杂的组合数计算。\n【验证】用组合数算：3 × C(52, 16)·C(36, 18)·C(18, 18) / [C(54, 18)·C(36, 18)]，结果也是 17/53。\n【面试这样说】“固定大王，它那一堆还剩 17 个位置，小王在 53 个位置里均匀分布，所以是 17/53。”\n【出处】国内面经高频", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\nfrom fractions import Fraction\n\ndef trial():\n    deck = list(range(54)); random.shuffle(deck)\n    pos = {c: i // 18 for i, c in enumerate(deck)}\n    return pos[0] == pos[1]\n\np = sum(trial() for _ in range(200_000)) / 200_000\nassert abs(p - 17 / 53) < 0.005\nprint(\"理论\", Fraction(17, 53), \"模拟\", round(p, 4))\n"}, "lists": [], "check": "ok"}, "puzzle-gamblers-ruin": {"id": "智30", "slug": "puzzle-gamblers-ruin", "title": "赌徒破产：从 k 元开始，先到 N 元的概率", "diff": "MEDIUM", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目】赌徒每局输赢各 1 元，赢的概率是 1/2。他从 k 元开始，输光（0 元）或赢到 N 元时停止。他赢到 N 元的概率是多少？平均玩多少局？\n【答案】赢到 N 的概率是 k/N；期望局数是 k(N − k)。\n【思路（概率）】1. 公平赌局里，钱数是一个鞅：每一步的期望变化为 0。2. 根据可选停时定理，停止时钱数的期望仍是 k。3. 停止时只有 0 或 N 两种结果，所以 N·P(到 N) + 0·P(到 0) = k，得到 P = k/N。\n【思路（期望局数）】设 E_k 为从 k 出发的期望局数，满足 E_k = 1 + ½E_(k−1) + ½E_(k+1)，边界 E_0 = E_N = 0，解得 E_k = k(N − k)。\n【不公平时】赢的概率为 p、输的概率为 q = 1 − p 时：P(到 N) = (1 − (q/p)^k) / (1 − (q/p)^N)。\n【面试这样说】“公平游戏里钱数是鞅，终值期望等于初值，所以到达 N 的概率是 k/N；期望局数由递推解得 k(N − k)。”\n【出处】量化面试经典", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\n\ndef play(k, N):\n    x, steps = k, 0\n    while 0 < x < N:\n        x += 1 if random.random() < 0.5 else -1; steps += 1\n    return x == N, steps\n\nk, N, n = 3, 10, 50_000\nres = [play(k, N) for _ in range(n)]\np = sum(w for w, _ in res) / n\ne = sum(s for _, s in res) / n\nassert abs(p - k / N) < 0.01 and abs(e - k * (N - k)) < 0.5\nprint(\"到达概率\", round(p, 3), \"期望局数\", round(e, 2))\n"}, "lists": [], "check": "ok"}, "puzzle-derangement": {"id": "智31", "slug": "puzzle-derangement", "title": "随机排列中不动点的个数和全错排概率", "diff": "MEDIUM", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目 1】n 个人把帽子放在一起，再每人随机拿一顶。期望有几个人拿到自己的帽子？\n【答案 1】1 个，和 n 无关。\n【思路】设指示变量 X_i：第 i 个人拿到自己的帽子时为 1，否则为 0。每人拿到自己帽子的概率都是 1/n，所以 E[X_i] = 1/n。根据期望的线性性，E[ΣX_i] = n × 1/n = 1。线性性不要求这些变量相互独立。\n【题目 2】没有任何人拿到自己帽子的概率是多少？\n【答案 2】约 1/e ≈ 0.368（全错排），n 较大时几乎不再变化。\n【思路】用容斥原理：P = Σ(k=0..n) (−1)^k / k!，它就是 e^(−1) 的泰勒展开，n 稍大时就非常接近 1/e。\n【技巧】看到“期望有多少个满足某条件”，先想“指示变量 + 期望线性性”。\n【面试这样说】“每人拿对的概率是 1/n，按线性性求和得到 1；全错排用容斥，结果约 1/e。”\n【出处】经典概率题", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import math, random\nfrom itertools import permutations\n\nfor n in range(1, 8):\n    perms = list(permutations(range(n)))\n    fixed = sum(sum(p[i] == i for i in range(n)) for p in perms) / len(perms)\n    assert abs(fixed - 1) < 1e-9\nnone = sum(all(p[i] != i for i in range(8)) for p in permutations(range(8))) / math.factorial(8)\nassert abs(none - 1 / math.e) < 1e-4\nprint(\"期望不动点 1；全错排概率\", round(none, 5), \"≈ 1/e\")\n"}, "lists": [], "check": "ok"}, "puzzle-two-children": {"id": "智32", "slug": "puzzle-two-children", "title": "两个孩子至少一个是男孩，两个都是男孩的概率", "diff": "EASY", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目】一个家庭有两个孩子，已知其中至少一个是男孩，两个都是男孩的概率是多少？\n【答案】1/3。\n【思路】1. 两个孩子按出生顺序有 4 种等可能情况：男男、男女、女男、女女。\n【思路】2. “至少一个男孩”排除了女女，剩下 3 种等可能情况。\n【思路】3. 其中只有男男一种满足“两个都是男孩”，所以是 1/3。\n【对比】如果已知“老大是男孩”，剩下男男、男女两种，答案是 1/2。\n【关键】条件不同，样本空间就不同。“至少一个”和“指定某一个”是两种不同的条件。\n【面试这样说】“列出四种等可能情况，去掉女女后剩三种，只有男男满足，所以是 1/3；如果条件是老大是男孩，就是 1/2。”\n【出处】经典条件概率", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\n\nboth = at_least = 0\nfor _ in range(300_000):\n    kids = (random.random() < 0.5, random.random() < 0.5)\n    if any(kids):\n        at_least += 1; both += all(kids)\nassert abs(both / at_least - 1 / 3) < 0.005\nprint(\"模拟\", round(both / at_least, 4))\n"}, "lists": [], "check": "ok"}, "puzzle-max-two-dice": {"id": "智33", "slug": "puzzle-max-two-dice", "title": "掷两次骰子取最大值，期望是多少", "diff": "EASY", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目】掷两次骰子，取两次中较大的点数，期望是多少？\n【答案】161/36 ≈ 4.47。\n【思路】1. 先求分布函数：P(max ≤ k) = P(两次都 ≤ k) = (k/6)²。\n【思路】2. 所以 P(max = k) = (k/6)² − ((k−1)/6)² = (2k − 1)/36。\n【思路】3. 期望 = Σ(k=1..6) k × (2k − 1)/36 = (1 + 6 + 15 + 28 + 45 + 66)/36 = 161/36。\n【技巧】求最大值的分布时，先求“≤ k”的概率，再做差。\n【推广】[0, 1] 上 n 个均匀随机数的最大值，期望是 n/(n+1)；最小值的期望是 1/(n+1)。\n【面试这样说】“最大值不超过 k 等价于两次都不超过 k，概率是 (k/6)²；做差得到分布，再求期望，结果是 161/36。”\n【出处】量化面试经典", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from fractions import Fraction\nfrom itertools import product\n\ne = Fraction(sum(max(a, b) for a, b in product(range(1, 7), repeat=2)), 36)\nassert e == Fraction(161, 36)\nprint(\"期望\", e, \"≈\", float(e))\n"}, "lists": [], "check": "ok"}, "puzzle-secretary": {"id": "智34", "slug": "puzzle-secretary", "title": "秘书问题：依次面试 n 人，怎样最大概率选到最好的", "diff": "HARD", "tags": [], "method": "概率与期望", "kind": "puzzle", "note": "【题目】n 个候选人按随机顺序依次面试，每面完一人就必须立刻决定录不录，不能回头。目标是录到最好的那个人。怎样做成功概率最大？\n【答案】先观察前约 n/e（约 37%）的人，都不录；之后遇到第一个比前面所有人都好的人就录。成功概率约 1/e ≈ 0.368。\n【思路】1. 假设先观察前 r 个人。最好的人排在第 i 位（i > r）时，我们能录到他，当且仅当前 i − 1 个人中最好的那个出现在前 r 个里，这个概率是 r/(i−1)。\n【思路】2. 对 i 求平均：P(成功) = (r/n) × Σ(i=r+1..n) 1/(i−1)。\n【思路】3. 设 x = r/n，当 n 很大时，P ≈ x·ln(1/x)。对 x 求导，最大值出现在 x = 1/e，最大概率也是 1/e。\n【应用】最优停止问题，也可以用来讨论“先探索多少，再开始决策”。\n【面试这样说】“先观察 37% 建立标准，之后遇到比标准更好的就录；成功概率约为 x·ln(1/x)，在 x = 1/e 时最大。”\n【出处】经典最优停止", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import math, random\n\ndef run(n, k):\n    a = list(range(n)); random.shuffle(a)\n    best_seen = max(a[:k]) if k else -1\n    for v in a[k:]:\n        if v > best_seen: return v == n - 1\n    return False\n\nn = 100\nk = round(n / math.e)\np = sum(run(n, k) for _ in range(50_000)) / 50_000\nassert abs(p - 1 / math.e) < 0.02\nprint(\"观察前\", k, \"人，成功率\", round(p, 3))\n"}, "lists": [], "check": "ok"}, "puzzle-rand7-rand10": {"id": "智35", "slug": "puzzle-rand7-rand10", "title": "用 rand7() 实现 rand10()", "diff": "MEDIUM", "tags": [], "method": "随机数与采样", "kind": "puzzle", "note": "【题目】只有一个等概率返回 1–7 的 rand7()，怎样实现等概率返回 1–10 的 rand10()？\n【答案】拒绝采样：调用两次 rand7 造出 1–49 的均匀数，只保留 1–40，再映射到 1–10。\n【思路】1. x = (rand7() − 1) × 7 + rand7()。第一次决定“行”，第二次决定“列”，49 个格子每个概率都是 1/49。\n【思路】2. 如果 x ≤ 40，返回 (x − 1) % 10 + 1。1–40 恰好能平均分成 10 组，每组 4 个数，概率相同。\n【思路】3. 如果 x 落在 41–49，丢弃并重新采样。\n【为什么不能直接取模】rand7() + rand7() 不是均匀的（中间值概率大）；直接用 1–49 对 10 取余，1–9 会比 10 多出现一次，也不均匀。\n【期望调用次数】每轮成功概率 40/49，每轮调 2 次 rand7，期望 2 × 49/40 ≈ 2.45 次。\n【优化】被拒绝的 41–49 可以减 40 得到 1–9 的均匀数，再和一次 rand7 组合，减少浪费。\n【面试这样说】“两次 rand7 构造 49 个等概率格子，取前 40 个映射到 10 个数，剩下的重采，期望约 2.45 次调用。”\n【出处】LeetCode 470（字节一面原题）", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\nfrom collections import Counter\n\nrand7 = lambda: random.randint(1, 7)\n\ndef rand10():\n    while True:\n        x = (rand7() - 1) * 7 + rand7()\n        if x <= 40:\n            return (x - 1) % 10 + 1\n\nc = Counter(rand10() for _ in range(200_000))\nassert set(c) == set(range(1, 11)) and max(c.values()) / min(c.values()) < 1.05\nprint(sorted(c.items()))\n"}, "lists": [], "check": "ok"}, "puzzle-fair-coin": {"id": "智36", "slug": "puzzle-fair-coin", "title": "用不公平的硬币生成公平结果", "diff": "EASY", "tags": [], "method": "随机数与采样", "kind": "puzzle", "note": "【题目】有一枚不公平的硬币，正面概率 p 未知（0<p<1）。怎样用它产生 50% 对 50% 的公平结果？\n【答案】冯·诺依曼方法：连抛两次，“正反”记为 0，“反正”记为 1；如果是“正正”或“反反”，就丢掉重抛。\n【为什么对】P(正反) = p(1−p)，P(反正) = (1−p)p，两者完全相等，所以在保留下来的结果里各占一半。\n【期望次数】每轮成功概率 2p(1−p)，每轮抛 2 次，期望总次数 1/(p(1−p))。p=1/2 时是 4 次。\n【反过来】用公平硬币生成概率为 p 的事件：把 p 写成二进制小数，逐位抛硬币比较，期望 2 次就能决定。\n【面试这样说】“利用对称性：正反和反正的概率都是 p(1−p)，相同结果丢掉重抛。”\n【出处】经典随机算法", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\n\ndef biased(p):\n    return random.random() < p\n\ndef fair(p):\n    while True:\n        a, b = biased(p), biased(p)\n        if a != b:\n            return int(a)\n\nfor p in (0.2, 0.7):\n    m = sum(fair(p) for _ in range(100_000)) / 100_000\n    assert abs(m - 0.5) < 0.01\nprint(\"p=0.2 和 p=0.7 都能得到约 50%\")\n"}, "lists": [], "check": "ok"}, "puzzle-reservoir": {"id": "智37", "slug": "puzzle-reservoir", "title": "数据流中等概率抽 k 个（蓄水池抽样）", "diff": "MEDIUM", "tags": [], "method": "随机数与采样", "kind": "puzzle", "note": "【题目】一个很长的数据流，长度未知，只能遍历一次。怎样等概率抽出 k 个元素？\n【答案】蓄水池抽样：先放入前 k 个；处理第 i 个元素（i>k）时，以 k/i 的概率选中它，并替换池中随机一个元素。\n【证明】看任意第 j 个元素（j>k）最后还在池中的概率：它被选入的概率是 k/j；之后每处理第 i 个元素，它被换掉的概率是 (k/i)×(1/k) = 1/i，所以保留概率是 (1 − 1/i)。连乘：k/j × j/(j+1) × (j+1)/(j+2) × … × (n−1)/n = k/n。前 k 个元素同理也是 k/n。\n【复杂度】时间 O(n)，空间 O(k)，不需要提前知道 n。\n【应用】在线日志采样；链表随机节点（LeetCode 382）；大规模数据集里随机抽样做评测。\n【面试这样说】“第 i 个元素以 k/i 的概率进池，之后每一步被替换的概率是 1/i，连乘后每个元素留下的概率都是 k/n。”\n【出处】LeetCode 382 / 398", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\nfrom collections import Counter\n\ndef reservoir(stream, k):\n    pool = []\n    for i, x in enumerate(stream, 1):\n        if i <= k:\n            pool.append(x)\n        elif random.random() < k / i:\n            pool[random.randrange(k)] = x\n    return pool\n\nc = Counter()\nfor _ in range(50_000):\n    c.update(reservoir(range(10), 3))\nassert all(abs(v / 50_000 - 0.3) < 0.01 for v in c.values())\nprint(\"每个元素被抽中的概率都约为 3/10\")\n"}, "lists": [], "check": "ok"}, "puzzle-shuffle": {"id": "智38", "slug": "puzzle-shuffle", "title": "怎样等概率洗牌（Fisher–Yates）", "diff": "EASY", "tags": [], "method": "随机数与采样", "kind": "puzzle", "note": "【题目】给一个数组，怎样随机打乱，使每种排列出现的概率都相同？\n【答案】Fisher–Yates 洗牌：i 从 n−1 递减到 1，每次在 [0, i] 中随机选一个下标 j，交换 a[i] 和 a[j]。\n【为什么对】第一步让每个元素都有 1/n 的概率被放到最后一位；第二步让剩下每个元素有 1/(n−1) 的概率放到倒数第二位……任意一种排列的概率都是 1/n × 1/(n−1) × … × 1 = 1/n!。\n【常见错误】每一位都和 [0, n) 中任意一位交换。这样会产生 n^n 条执行路径，而 n^n 不能被 n! 整除，所以不同排列出现的次数不可能相同。\n【复杂度】时间 O(n)，原地完成，不需要额外空间。\n【面试这样说】“从后往前，每次在还没确定的部分中等概率选一个放到当前位置，每种排列的概率都是 1/n!。”\n【出处】经典随机算法；LeetCode 384", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\nfrom collections import Counter\n\ndef fisher_yates(a):\n    a = a[:]\n    for i in range(len(a) - 1, 0, -1):\n        j = random.randint(0, i)\n        a[i], a[j] = a[j], a[i]\n    return tuple(a)\n\ndef naive(a):\n    a = a[:]\n    for i in range(len(a)):\n        j = random.randrange(len(a))\n        a[i], a[j] = a[j], a[i]\n    return tuple(a)\n\nn = 120_000\ngood = Counter(fisher_yates([1, 2, 3]) for _ in range(n))\nbad = Counter(naive([1, 2, 3]) for _ in range(n))\nassert max(good.values()) / min(good.values()) < 1.05\nassert max(bad.values()) / min(bad.values()) > 1.2\nprint(\"Fisher–Yates 均匀；朴素交换不均匀\")\n"}, "lists": [], "check": "ok"}, "puzzle-weighted-sampling": {"id": "智39", "slug": "puzzle-weighted-sampling", "title": "按权重随机抽样", "diff": "MEDIUM", "tags": [], "method": "随机数与采样", "kind": "puzzle", "note": "【题目】给定权重数组 w，怎样随机抽一个下标，使下标 i 被抽中的概率等于 w[i] / Σw？\n【答案】前缀和 + 二分查找。\n【思路】1. 计算前缀和 pre，例如 w = [1, 3, 6] 时 pre = [1, 4, 10]。这相当于把长度为 10 的线段分成 [0, 1)、[1, 4)、[4, 10) 三段。\n【思路】2. 在 [0, 总和) 中均匀取一个随机数 r。\n【思路】3. 用二分查找找到第一个满足 pre[i] > r 的位置 i，返回 i。r 落在哪段，就抽中哪个下标；每段长度正好等于权重。\n【复杂度】预处理 O(n)，每次抽样 O(log n)。\n【进阶】需要大量抽样时可以用 Alias 方法，每次 O(1)。大模型解码中的 top-k 和 top-p 采样，也是先截断概率分布，再按权重抽样。\n【面试这样说】“把权重摊在一条线段上，用前缀和表示各段边界，随机取一个点，再二分查找它落在哪一段。”\n【出处】LeetCode 528", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import bisect, random\nfrom itertools import accumulate\nfrom collections import Counter\n\nclass Sampler:\n    def __init__(self, w):\n        self.pre = list(accumulate(w))\n    def pick(self):\n        return bisect.bisect_right(self.pre, random.random() * self.pre[-1])\n\nw = [1, 3, 6]\ns = Sampler(w)\nc = Counter(s.pick() for _ in range(200_000))\nassert all(abs(c[i] / 200_000 - w[i] / 10) < 0.01 for i in range(3))\nprint({i: round(c[i] / 200_000, 3) for i in range(3)})\n"}, "lists": [], "check": "ok"}, "puzzle-estimate-pi": {"id": "智40", "slug": "puzzle-estimate-pi", "title": "用随机数估计 π", "diff": "EASY", "tags": [], "method": "随机数与采样", "kind": "puzzle", "note": "【题目】只有 [0, 1] 均匀随机数，怎样估计 π？\n【答案】蒙特卡洛：在单位正方形里均匀撒点，统计落在四分之一圆 x² + y² < 1 内的比例 p，则 π ≈ 4p。\n【为什么】四分之一圆面积是 π/4，正方形面积是 1，点落在圆内的概率就是 π/4。\n【误差】估计值的标准差约为 √(p(1 − p)/n) × 4，误差按 1/√n 下降。想多精确一位小数，大约需要 100 倍样本。\n【改进】可以用分层抽样或拟蒙特卡洛降低方差。\n【面试这样说】“点落在四分之一圆内的概率是 π/4，所以 4 乘以比例就能估计 π；误差按 1/√n 下降。”\n【出处】蒙特卡洛入门", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\n\nn = 400_000\ninside = sum(random.random() ** 2 + random.random() ** 2 < 1 for _ in range(n))\nest = 4 * inside / n\nassert abs(est - 3.14159) < 0.02\nprint(\"估计 π ≈\", round(est, 4))\n"}, "lists": [], "check": "ok"}, "puzzle-rand2-to-randn": {"id": "智41", "slug": "puzzle-rand2-to-randn", "title": "用 rand2() 生成 [0, n) 的均匀随机数", "diff": "EASY", "tags": [], "method": "随机数与采样", "kind": "puzzle", "note": "【题目】只有等概率返回 0 或 1 的 rand2()，怎样生成 [0, n) 中的均匀整数？\n【答案】按二进制拼数，再做拒绝采样。\n【思路】1. 取 k = ⌈log2 n⌉，调用 k 次 rand2，把结果拼成 [0, 2^k) 中的一个均匀整数 x。\n【思路】2. 如果 x < n，直接返回 x。\n【思路】3. 否则丢弃，重新采样。\n【期望次数】因为 2^k < 2n，每轮成功概率大于 1/2，所以期望不到 2 轮。\n【关系】它和 rand7→rand10 是同一类问题：先构造一个足够大的均匀范围，再拒绝多出来的部分。\n【面试这样说】“用二进制拼出 [0, 2^k) 的均匀数，超出 n 的部分拒绝重采，期望不到 2 轮。”\n【出处】拒绝采样", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\nfrom collections import Counter\n\nrand2 = lambda: random.getrandbits(1)\n\ndef randn(n):\n    k = max(1, (n - 1).bit_length())\n    while True:\n        x = 0\n        for _ in range(k): x = x << 1 | rand2()\n        if x < n: return x\n\nc = Counter(randn(6) for _ in range(120_000))\nassert set(c) == set(range(6)) and max(c.values()) / min(c.values()) < 1.05\nprint(sorted(c.items()))\n"}, "lists": [], "check": "ok"}, "puzzle-factorial-zeros": {"id": "智42", "slug": "puzzle-factorial-zeros", "title": "100! 末尾有几个 0", "diff": "EASY", "tags": [], "method": "数学技巧", "kind": "puzzle", "note": "【题目】100 的阶乘末尾有几个 0？\n【答案】24 个。\n【思路】1. 末尾的 0 来自因子 10 = 2 × 5。\n【思路】2. 1 到 100 中因子 2 远多于因子 5，所以 0 的个数等于因子 5 的个数。\n【思路】3. 5 的倍数有 ⌊100/5⌋ = 20 个，各贡献一个 5；25 的倍数（25、50、75、100）还要再多贡献一个，⌊100/25⌋ = 4。125 > 100，停止。合计 24。\n【一般公式】n! 末尾 0 的个数 = ⌊n/5⌋ + ⌊n/25⌋ + ⌊n/125⌋ + …（勒让德公式）。\n【常见错误】只算 100/5 = 20，漏掉 25、50、75、100 多出的那个 5。\n【面试这样说】“0 来自 2×5，5 比 2 少，所以数 5 的个数：20 + 4 = 24。”\n【出处】经典题；LeetCode 172", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import math\n\ndef zeros(n):\n    c = 0\n    while n:\n        n //= 5\n        c += n\n    return c\n\ns = str(math.factorial(100))\nassert zeros(100) == 24 == len(s) - len(s.rstrip(\"0\"))\nprint(zeros(100))\n"}, "lists": [], "check": "ok"}, "puzzle-clock-angle": {"id": "智43", "slug": "puzzle-clock-angle", "title": "3 点 15 分时针和分针的夹角", "diff": "EASY", "tags": [], "method": "数学技巧", "kind": "puzzle", "note": "【题目】3 点 15 分时，时针和分针的夹角是多少度？\n【答案】7.5 度。\n【思路】1. 分针每分钟走 6°（360°/60），时针每分钟走 0.5°（30°/60）。\n【思路】2. 3:15 时，分针在 15×6 = 90°。时针在 3×30 + 15×0.5 = 97.5°。\n【思路】3. 夹角 = |97.5 − 90| = 7.5°。如果结果大于 180°，用 360° 减去它。\n【通用公式】h 时 m 分的夹角 = |30h − 5.5m|，再和 360 减去它的值取较小者。\n【追问】一天里两针重合几次？分针每分钟比时针多走 5.5°，每 720/11 分钟追上一次，12 小时 11 次，24 小时 22 次。\n【常见错误】以为 3:15 时针正好指着 3，答 0°。\n【面试这样说】“分针 6°/分，时针 0.5°/分，3:15 时时针多走了 7.5°。”\n【出处】经典题；LeetCode 1344", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "def angle(h, m):\n    d = abs((h % 12) * 30 + m * 0.5 - m * 6)\n    return min(d, 360 - d)\n\nassert angle(3, 15) == 7.5 and angle(12, 0) == 0\n# 分针相对时针每分钟快 5.5 度，每 720/11 分钟追上一次 → 24 小时追上 24*60 / (720/11) = 22 次\nassert 24 * 60 * 11 // 720 == 22\nprint(angle(3, 15), \"度；一天重合 22 次\")\n"}, "lists": [], "check": "ok"}, "puzzle-mislabeled-boxes": {"id": "智44", "slug": "puzzle-mislabeled-boxes", "title": "三个标签全贴错的盒子，拿几次能全部改对", "diff": "EASY", "tags": [], "method": "数学技巧", "kind": "puzzle", "note": "【题目】三个盒子分别标着“苹果”“橘子”“混合”，但所有标签都贴错了。只允许从一个盒子里拿出一个水果看，怎样把三个标签全部改对？\n【答案】从标着“混合”的盒子里拿一个。\n【思路】1. 标着“混合”的盒子一定不是混合，只能是纯苹果或纯橘子。拿出一个就知道它到底是哪种。\n【思路】2. 假设拿出的是苹果，那它就是苹果盒。\n【思路】3. 标着“橘子”的盒子不能是橘子（标签错），也不能是苹果（已经确定），所以是混合。\n【思路】4. 剩下标着“苹果”的盒子就是橘子盒。\n【常见错误】从标着“苹果”或“橘子”的盒子里拿：拿到苹果时，无法区分它是混合盒还是苹果盒，信息不够。\n【面试这样说】“从标着混合的盒子拿，它一定是纯的；确定它以后，利用‘标签全错’就能推出另外两个。”\n【出处】量化面试经典（Zhou 绿皮书第 2 章）", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from itertools import permutations\n\nlabels = [\"apple\", \"orange\", \"mix\"]\nfor real in permutations(labels):                   # real[i] = 标着 labels[i] 的盒子里实际装的东西\n    if any(r == l for r, l in zip(real, labels)):    # 必须全部贴错\n        continue\n    fruit = real[2]                                  # 从“混合”盒拿到的水果：这个盒子就是该水果\n    other = \"orange\" if fruit == \"apple\" else \"apple\"\n    guess = {2: fruit,\n             labels.index(other): \"mix\",             # 标着另一种水果的盒子：不能是它本身，也不能是 fruit → 混合\n             labels.index(fruit): other}             # 剩下的盒子\n    assert [guess[i] for i in range(3)] == list(real)\nprint(\"从“混合”盒拿 1 次即可\")\n"}, "lists": [], "check": "ok"}, "puzzle-sqrt-newton": {"id": "智45", "slug": "puzzle-sqrt-newton", "title": "不用库函数求平方根", "diff": "EASY", "tags": [], "method": "数学技巧", "kind": "puzzle", "note": "【题目】不调用 sqrt，求 x 的平方根。可以是整数部分，也可以要求精确到若干位小数。（整数版是 LeetCode 69）\n【方法 1：二分查找】在 [0, x] 中二分，找最大的 m 满足 m² ≤ x。每轮把区间缩小一半，时间 O(log x)。注意 m² 可能溢出，可以改写成 m ≤ x / m 来比较。\n【方法 2：牛顿迭代】令 f(r) = r² − x，牛顿法给出 r ← r − f(r)/f'(r) = (r + x/r)/2。从 r = x（或 1）开始迭代，直到 r² 和 x 足够接近。\n【牛顿法为什么快】它是二次收敛：接近答案后，每迭代一次，有效数字位数大约翻倍，通常几次就够。\n【面试这样说】“整数版用二分，找最大的 m 满足 m² ≤ x；实数版用牛顿迭代 r = (r + x/r)/2，二次收敛。”\n【出处】LeetCode 69", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "def isqrt_bs(x):\n    lo, hi = 0, x\n    while lo < hi:\n        mid = (lo + hi + 1) // 2\n        if mid * mid <= x: lo = mid\n        else: hi = mid - 1\n    return lo\n\ndef sqrt_newton(x, eps=1e-12):\n    r = max(1.0, x)\n    while abs(r * r - x) > eps * max(1, x):\n        r = (r + x / r) / 2\n    return r\n\nassert all(isqrt_bs(x) == int(x ** 0.5) for x in range(10_000))\nassert abs(sqrt_newton(2) - 2 ** 0.5) < 1e-9\nprint(isqrt_bs(2147395599), sqrt_newton(2))\n"}, "lists": [], "check": "ok"}, "puzzle-handshakes": {"id": "智46", "slug": "puzzle-handshakes", "title": "n 个人两两握手 / n 支队伍单循环赛几场", "diff": "EASY", "tags": [], "method": "数学技巧", "kind": "puzzle", "note": "【题目】n 个人两两握一次手，一共握多少次？n 支队伍打单败淘汰赛，要打多少场才能决出冠军？\n【答案】握手 n(n − 1)/2 次；单败淘汰赛 n − 1 场。\n【握手】每次握手对应从 n 个人中选 2 个，所以是 C(n, 2) = n(n − 1)/2。也可以这样算：每人握 n − 1 次，n 人共 n(n − 1) 次，但每次握手被两个人各算了一次，所以除以 2。\n【淘汰赛】每场比赛正好淘汰 1 支队伍。决出冠军时要淘汰 n − 1 支，所以正好打 n − 1 场，和是否有轮空无关。\n【技巧】不要模拟每一轮，直接找每次操作和最终目标之间的一一对应关系。\n【面试这样说】“握手就是选两个人，C(n, 2)；淘汰赛每场淘汰一支队伍，所以一共 n − 1 场。”\n【出处】经典计数题", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from itertools import combinations\n\ndef knockout(n):\n    games = 0\n    while n > 1:\n        games += n // 2; n = n - n // 2\n    return games\n\nassert all(len(list(combinations(range(n), 2))) == n * (n - 1) // 2 for n in range(1, 30))\nassert all(knockout(n) == n - 1 for n in range(1, 200))\nprint(\"100 人握手\", 100 * 99 // 2, \"次；128 队淘汰赛\", knockout(128), \"场\")\n"}, "lists": [], "check": "ok"}, "ml-sft": {"id": "M20", "slug": "ml-sft", "title": "SFT 损失（label shift + mask）", "diff": "EASY", "tags": [], "method": "微调", "kind": "ml", "note": "L = −(1/N)·Σ_t mask_t·log π(y_t | x, y_<t)，N 是有效 token 数\n错位：第 t 个位置的 logits 预测第 t+1 个 token，所以 logits[:, :-1] 对齐 labels[:, 1:]\nprompt、system、工具返回、padding 的 label 设为 -100，只对 assistant 回答计 loss\n多轮对话可以只训最后一轮，也可以训每一轮的 assistant（mask_history 只训最后一轮）\ntoken 级平均让长回答权重更大；按样本平均则每条样本权重相同\n本质就是对回答 token 做交叉熵，等价于最大化 log π(y|x)，即 DPO 里那个序列对数概率", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import math\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\n\ndef build_labels(input_ids, prompt_lens, ignore_index=-100):\n    # 只对回答部分计 loss：prompt（system/user/工具结果）位置置为 -100\n    labels = input_ids.clone()\n    for b, n in enumerate(prompt_lens):\n        labels[b, :n] = ignore_index\n    return labels\n\n\ndef sft_loss(logits, labels, ignore_index=-100):\n    # logits: (B, L, V)；labels: (B, L)，与 input_ids 对齐，不需要的位置为 -100\n    # 第 t 个位置预测第 t+1 个 token：logits 去掉最后一位，labels 去掉第一位\n    shift_logits = logits[:, :-1, :].contiguous()\n    shift_labels = labels[:, 1:].contiguous()\n    return F.cross_entropy(\n        shift_logits.view(-1, shift_logits.size(-1)),\n        shift_labels.view(-1),\n        ignore_index=ignore_index,      # 按有效 token 数取平均（token 级平均）\n    )\n\n\ndef sft_loss_manual(logits, labels, ignore_index=-100):\n    # 手写版：log_softmax + gather + mask，结果与上面一致\n    logp = F.log_softmax(logits[:, :-1].float(), dim=-1)\n    tgt = labels[:, 1:]\n    mask = (tgt != ignore_index).float()\n    tok_logp = logp.gather(-1, tgt.clamp(min=0).unsqueeze(-1)).squeeze(-1)\n    return -(tok_logp * mask).sum() / mask.sum()\n\n\n# 测试\ntorch.manual_seed(0)\nB, L, V = 2, 6, 11\ninput_ids = torch.randint(0, V, (B, L))\nlogits = torch.randn(B, L, V)\nlabels = build_labels(input_ids, prompt_lens=[3, 2])\nassert (labels[0, :3] == -100).all() and labels[0, 3] == input_ids[0, 3]\na, b = sft_loss(logits, labels), sft_loss_manual(logits, labels)\nassert torch.allclose(a, b, atol=1e-6)\n# 手算：样本 0 的有效目标是位置 3,4,5（由位置 2,3,4 预测），样本 1 是位置 2..5\nlp = F.log_softmax(logits, -1)\nterms = [lp[0, t - 1, input_ids[0, t]] for t in (3, 4, 5)] + [lp[1, t - 1, input_ids[1, t]] for t in (2, 3, 4, 5)]\nassert torch.allclose(a, -torch.stack(terms).mean(), atol=1e-6)\n# 全部是 prompt 时没有可训练的 token\nassert (build_labels(input_ids, [L, L])[:, 1:] == -100).all()\nprint(\"全部测试通过\")\n"}, "lists": [], "check": "ok"}, "gb-birthday": {"id": "智47", "slug": "gb-birthday", "title": "猜生日：只知道月份和只知道日子的两个人", "diff": "MEDIUM", "tags": [], "method": "逻辑推理", "kind": "puzzle", "note": "【题目】老板的生日是下面 10 个日期之一：3 月 4、5、8 日；6 月 4、7 日；9 月 1、5 日；12 月 1、2、8 日。老板只把月份告诉 A，只把日子告诉 B。A 说：“我不知道，但我确定 B 也不知道。”B 说：“本来不知道，现在知道了。”A 说：“那我也知道了。”生日是哪天？\n【答案】9 月 1 日。\n【思路】1. 只出现一次的日子是 7（6 月）和 2（12 月）。如果月份是 6 月或 12 月，B 有可能直接知道；A 能确定 B 不知道，说明月份只能是 3 月或 9 月。\n【思路】2. 剩下 3 月 4、5、8 日和 9 月 1、5 日。B 说现在知道了，说明日子不是 5（5 在两个月里都有），只剩 3 月 4、3 月 8、9 月 1。\n【思路】3. A 说他也知道了：如果是 3 月，还有 4 和 8 两种可能，A 不可能知道；所以是 9 月 1 日。\n【面试这样说】“每句话都在排除候选：第一句排除含唯一日子的月份，第二句排除重复的日子，第三句要求该月只剩一个日期。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "dates = [(3, 4), (3, 5), (3, 8), (6, 4), (6, 7), (9, 1), (9, 5), (12, 1), (12, 2), (12, 8)]\n\ndef by(cands, key):\n    from collections import Counter\n    return Counter(key(d) for d in cands)\n\n# 1) A(月) 不知道，且确定 B(日) 也不知道：该月里没有唯一的日子\nday_cnt = by(dates, lambda d: d[1])\ns1 = [d for d in dates if all(day_cnt[x[1]] > 1 for x in dates if x[0] == d[0])\n      and sum(x[0] == d[0] for x in dates) > 1]\n# 2) B 现在知道：日子在 s1 里唯一\nc = by(s1, lambda d: d[1]); s2 = [d for d in s1 if c[d[1]] == 1]\n# 3) A 现在知道：月份在 s2 里唯一\nc = by(s2, lambda d: d[0]); s3 = [d for d in s2 if c[d[0]] == 1]\nassert s3 == [(9, 1)]\nprint(\"生日:\", s3[0])\n"}, "lists": [], "check": "ok"}, "gb-card-piles": {"id": "智48", "slug": "gb-card-piles", "title": "红黑牌两两翻开，牌多者赢 100 美元", "diff": "EASY", "tags": [], "method": "逻辑推理", "kind": "puzzle", "note": "【题目】一副 52 张牌（26 红 26 黑）洗好后，每次翻开两张：两张都是黑，归你；两张都是红，归庄家；一红一黑，丢掉。全部翻完后，你的牌比庄家多就赢 100 美元。你最多愿意付多少钱玩？\n【答案】0 元。你永远赢不了。\n【思路】1. 被丢掉的牌一红一黑成对出现，所以丢掉的红牌数 = 丢掉的黑牌数。\n【思路】2. 你的牌数 = 26 − 丢掉的黑牌数；庄家的牌数 = 26 − 丢掉的红牌数。两者永远相等。\n【面试这样说】“丢牌总是一红一黑，所以剩下的黑牌和红牌一样多，两堆必然相等，不付钱。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\nfor _ in range(10000):\n    deck = [\"R\"] * 26 + [\"B\"] * 26\n    random.shuffle(deck)\n    me = dealer = 0\n    for i in range(0, 52, 2):\n        a, b = deck[i], deck[i + 1]\n        if a == b == \"B\": me += 2\n        elif a == b == \"R\": dealer += 2\n    assert me == dealer\nprint(\"两堆永远一样多\")\n"}, "lists": [], "check": "ok"}, "gb-power-tower": {"id": "智49", "slug": "gb-power-tower", "title": "无限幂塔 x^x^x^… = 2，求 x", "diff": "EASY", "tags": [], "method": "逻辑推理", "kind": "puzzle", "note": "【题目】若 x^(x^(x^…)) = 2（无穷层），x 是多少？\n【答案】x = √2。\n【思路】1. 设整个幂塔为 y = 2。因为是无穷层，去掉最底下一层还是同一个幂塔，所以 x^y = y，即 x^2 = 2，x = √2。\n【追问】如果等于 4 呢？同样算出 x = √2，和上面矛盾。原因是幂塔只在 y ∈ [1/e, e] 时收敛，4 > e，所以“= 4”无解；√2 的幂塔收敛到 2，不是 4。\n【面试这样说】“利用自相似：x^y = y，代入 y = 2 得 √2。追问 4 时要说明收敛区间，只有 y ≤ e 才有解。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import math\nx = math.sqrt(2)\nt = 1.0\nfor _ in range(2000):\n    t = x ** t\nassert abs(t - 2) < 1e-9          # √2 的幂塔收敛到 2，而不是 4\nprint(\"x = √2, tower ->\", round(t, 6))\n"}, "lists": [], "check": "ok"}, "gb-box-bricks": {"id": "智50", "slug": "gb-box-bricks", "title": "53 块 1×1×4 的砖能否装进 6×6×6 的箱子", "diff": "HARD", "tags": [], "method": "跳出思维框架", "kind": "puzzle", "note": "【题目】能否把 53 块 1×1×4 的砖块放进一个 6×6×6 的箱子？\n【答案】不能，最多 52 块。\n【思路】1. 把箱子切成 27 个 2×2×2 的小块，像三维棋盘一样黑白相间着色：一种颜色 14 块，另一种 13 块。\n【思路】2. 一块 1×1×4 的砖沿某个方向穿过两个相邻的小块，每个小块各占 2 个单位，所以每块砖一定占 2 个黑单位、2 个白单位。\n【思路】3. 颜色少的那种只有 13 × 8 = 104 个单位，最多支持 104 / 2 = 52 块砖。总体积 216 ≥ 212 并不说明能装下。\n【面试这样说】“用 2×2×2 的块做三维棋盘染色，每块砖黑白各占 2，少数颜色只有 104 个单位，所以最多 52 块。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from itertools import product\ncolor = lambda x, y, z: (x // 2 + y // 2 + z // 2) % 2\ncells = list(product(range(6), repeat=3))\nblack = sum(color(*c) for c in cells)\nassert min(black, 216 - black) == 104          # 13 个 2x2x2 块 × 8\n# 任意位置、任意方向的 1x1x4 砖都恰好占 2 黑 2 白\nfor x, y, z in cells:\n    for d in range(3):\n        cs = [tuple(v + (i if k == d else 0) for k, v in enumerate((x, y, z))) for i in range(4)]\n        if all(max(c) < 6 for c in cs):\n            assert sum(color(*c) for c in cs) == 2\nprint(\"每块砖 2 黑 2 白，最多\", 104 // 2, \"块\")\n"}, "lists": [], "check": "ok"}, "gb-calendar-dice": {"id": "智51", "slug": "gb-calendar-dice", "title": "两颗骰子表示每月 01 到 31 日", "diff": "MEDIUM", "tags": [], "method": "跳出思维框架", "kind": "puzzle", "note": "【题目】用两颗六面骰子摆出每月的日期 01–31（两位数，例如 05、21）。每个面写一个数字，骰子可以任意交换位置。怎么写？\n【答案】骰子 1：0、1、2、3、4、5；骰子 2：0、1、2、6、7、8。6 倒过来当 9 用。\n【思路】1. 11 和 22 要求两颗骰子都有 1 和 2。\n【思路】2. 01–09 要和 0 配对，如果只有一颗骰子有 0，另一颗要放下 1–9 共 9 个数，放不下，所以两颗都要有 0。\n【思路】3. 已用 6 个面（每颗 0、1、2），还剩 6 个面要放 3、4、5、6、7、8、9 共 7 个数字。关键是 6 和 9 共用一个面。\n【面试这样说】“0、1、2 两颗都要有，剩 6 个面放 7 个数字，靠 6 翻成 9 省一个面。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "d1 = {0, 1, 2, 3, 4, 5}\nd2 = {0, 1, 2, 6, 7, 8}\nshow = lambda s: s | ({9} if 6 in s else set())\nfor day in range(1, 32):\n    a, b = divmod(day, 10)\n    assert (a in show(d1) and b in show(d2)) or (a in show(d2) and b in show(d1)), day\nprint(\"01-31 全部能摆出\")\n"}, "lists": [], "check": "ok"}, "gb-offer-door": {"id": "智52", "slug": "gb-offer-door", "title": "两扇门两个守卫，一真一假，只问一个问题", "diff": "EASY", "tags": [], "method": "跳出思维框架", "kind": "puzzle", "note": "【题目】两扇门，一扇通往 offer，一扇不是。每扇门前有一个守卫，一个永远说真话、一个永远说假话，你不知道谁是谁。只能问其中一个守卫一个是非题，怎样选到 offer 门？\n【答案】问任意一个守卫：“另一个守卫会说你守的这扇门是 offer 门吗？”回答“是”，就选另一扇门；回答“否”，就选这扇门。\n【思路】这个问题同时经过一个说真话的人和一个说假话的人，真话 × 假话 = 假话，所以答案一定是事实的反面，和你问的是谁无关。\n【面试这样说】“把两个人串起来问，信息经过一次真、一次假，结果必然是反的，按相反的去选就行。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "for offer_here in (True, False):          # 被问守卫守的门是不是 offer 门\n    for asked_truthful in (True, False):\n        other_says = offer_here if not asked_truthful else not offer_here   # 另一人对这扇门的说法\n        answer = other_says if asked_truthful else not other_says\n        choose_this = not answer\n        assert choose_this == offer_here\nprint(\"回答“是”选另一扇，回答“否”选这扇\")\n"}, "lists": [], "check": "ok"}, "gb-padlock": {"id": "智53", "slug": "gb-padlock", "title": "两人各有一把锁和钥匙，怎样安全寄东西", "diff": "EASY", "tags": [], "method": "跳出思维框架", "kind": "puzzle", "note": "【题目】你要给朋友寄一个箱子，邮寄途中只要箱子没锁就会被偷。你和朋友各有一把锁，各自只有自己那把锁的钥匙，事先无法交换钥匙。怎么寄？\n【答案】你锁上自己的锁寄出；朋友再加上他的锁寄回；你打开自己的锁再寄出；朋友用自己的钥匙打开。\n【思路】每一段路上箱子至少挂着一把锁，而每把锁只由主人亲手打开。这就是“三次传递”协议，思想和公钥加密里的交换律加密一样。\n【面试这样说】“双锁来回：我上锁 → 他加锁 → 我解我的 → 他解他的，全程至少一把锁。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "box = set()\nbox.add(\"me\");     assert box            # 寄给朋友，途中有锁\nbox.add(\"friend\"); assert box            # 寄回给我\nbox.remove(\"me\");  assert box            # 再寄给朋友，途中仍有朋友的锁\nbox.remove(\"friend\")\nassert not box\nprint(\"每段路上都至少有一把锁\")\n"}, "lists": [], "check": "ok"}, "gb-last-ball": {"id": "智54", "slug": "gb-last-ball", "title": "20 蓝 14 红，取两球按规则放回，最后一球什么颜色", "diff": "MEDIUM", "tags": [], "method": "跳出思维框架", "kind": "puzzle", "note": "【题目】袋里 20 个蓝球、14 个红球。每次取出两个：同色就放回一个蓝球，异色就放回一个红球。最后剩一个球，是什么颜色？如果是 20 蓝 13 红呢？\n【答案】14 红时最后是蓝球；13 红时最后是红球。\n【思路】1. 看红球数：两红 → 红球减 2；两蓝 → 不变；一红一蓝 → 红球不变（拿走一个红、放回一个红）。\n【思路】2. 所以红球数的奇偶性永远不变。14 是偶数，最后不可能只剩 1 个红球，只能是蓝；13 是奇数，最后一定是红。\n【面试这样说】“找不变量：红球数的奇偶性不变，偶数最后是蓝，奇数最后是红。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\ndef last(blue, red):\n    bag = [\"B\"] * blue + [\"R\"] * red\n    while len(bag) > 1:\n        random.shuffle(bag)\n        a, b = bag.pop(), bag.pop()\n        bag.append(\"B\" if a == b else \"R\")\n    return bag[0]\nfor _ in range(2000):\n    assert last(20, 14) == \"B\" and last(20, 13) == \"R\"\nprint(\"红球数奇偶不变\")\n"}, "lists": [], "check": "ok"}, "gb-light-switches": {"id": "智55", "slug": "gb-light-switches", "title": "屋外 4 个开关，只进屋一次，找出控制灯的那个", "diff": "EASY", "tags": [], "method": "跳出思维框架", "kind": "puzzle", "note": "【题目】屋外有 4 个开关，其中一个控制屋内的一盏白炽灯。你只能进屋一次，怎样确定是哪个开关？\n【答案】打开 1、2 号，等几分钟；关掉 2 号，打开 3 号；立刻进屋。灯亮且烫 → 1；灯灭但烫 → 2；灯亮但不烫 → 3；灯灭且不烫 → 4。\n【思路】只看亮灭只能区分两种状态，再加一个维度：灯泡的温度。亮/灭 × 热/冷 正好 4 种组合。\n【面试这样说】“亮灭只有两种信息，再利用灯泡发热这个第二个维度，组合出四种状态。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "def observe(switch):\n    on_long = switch in (1, 2)        # 先开了一段时间 -> 灯泡热\n    on_now = switch in (1, 3)\n    return on_now, on_long\nseen = {observe(s): s for s in range(1, 5)}\nassert len(seen) == 4\nprint({(\"亮\" if a else \"灭\") + (\"热\" if b else \"冷\"): s for (a, b), s in seen.items()})\n"}, "lists": [], "check": "ok"}, "gb-average-salary": {"id": "智56", "slug": "gb-average-salary", "title": "5 个人不暴露自己的工资，算出平均工资", "diff": "EASY", "tags": [], "method": "跳出思维框架", "kind": "puzzle", "note": "【题目】5 个同事想知道平均工资，但谁都不愿让别人知道自己的工资。怎么算？\n【答案】第 1 个人想一个只有自己知道的随机数 R，加上自己的工资，把结果告诉第 2 个人；每个人把自己的工资加上去再往下传；最后传回第 1 个人，减去 R 再除以 5。\n【思路】每个人看到的都是“随机数 + 前面几人工资的和”，推不出任何单个人的工资。这就是安全多方求和的最简单版本。\n【追问】如果有人串通（第 1 个和第 3 个人对账），就能推出第 2 个人的工资；更安全的做法是每人把工资拆成随机份额分给其他人。\n【面试这样说】“用随机数做掩码，绕一圈求和，最后减掉掩码。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\nsalaries = [12000, 15000, 30000, 8000, 20000]\nR = random.randint(10**6, 10**7)\nrunning = R\nfor s in salaries:\n    running += s\navg = (running - R) / len(salaries)\nassert avg == sum(salaries) / 5\nprint(\"平均工资\", avg)\n"}, "lists": [], "check": "ok"}, "gb-coin-flip-piles": {"id": "智57", "slug": "gb-coin-flip-piles", "title": "1000 枚硬币 20 枚正面，看不见也摸不出，分成正面数相同的两堆", "diff": "MEDIUM", "tags": [], "method": "巧用对称性", "kind": "puzzle", "note": "【题目】桌上 1000 枚硬币，恰好 20 枚正面朝上。你蒙着眼，摸不出正反，但可以翻转硬币。怎样分成两堆，使两堆正面朝上的数量相同？\n【答案】随便拿 20 枚放成一堆，把这 20 枚全部翻面。\n【思路】1. 设拿出的 20 枚里有 k 枚正面，那么剩下的 980 枚里正面有 20 − k 枚。\n【思路】2. 把拿出的 20 枚全翻面，正面数变成 20 − k，和另一堆相等。\n【面试这样说】“取出与正面总数相同的硬币全部翻转，k 个正面变成 20 − k 个，正好和另一堆一样。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\nfor _ in range(5000):\n    coins = [1] * 20 + [0] * 980\n    random.shuffle(coins)\n    small = [1 - c for c in coins[:20]]       # 拿出 20 枚并全部翻面\n    assert sum(small) == sum(coins[20:])\nprint(\"两堆正面数相同\")\n"}, "lists": [], "check": "ok"}, "gb-wise-men-cup": {"id": "智58", "slug": "gb-wise-men-cup", "title": "50 个囚犯和一个杯子，怎样确定所有人都进过房间", "diff": "HARD", "tags": [], "method": "巧用对称性", "kind": "puzzle", "note": "【题目】50 个囚犯，每天随机挑一个人进房间，房间里有一个杯子，可以正放或倒放。只要有人能确定“所有人都至少进过一次”，大家就获释；说错全体处死。事先可以商量策略，之后不能交流。怎么做？\n【答案】选一个人当计数员。其他人：第一次看到杯子正放时把它倒过来（以后不再动）；计数员：每次看到杯子倒放就把它正放回来，并给计数加 1。计数到 49 时宣布。\n【思路】1. 每个非计数员恰好“报到”一次（翻倒一次），只有计数员会把杯子复位，所以计数不会重复也不会漏。\n【思路】2. 计数到 49，说明其他 49 人都来过，加上计数员自己，就是 50 人。\n【面试这样说】“用一个计数员加一位共享状态：每个人只发一次信号，计数员负责清零和计数。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\nN = 50\nfor trial in range(200):\n    cup_down, count, reported, visited = False, 0, set(), set()\n    while True:\n        p = random.randrange(N); visited.add(p)\n        if p == 0:\n            if cup_down:\n                cup_down, count = False, count + 1\n                if count == N - 1:\n                    assert len(visited) == N\n                    break\n        elif not cup_down and p not in reported:\n            cup_down = True; reported.add(p)\nprint(\"计数到 49 时所有人都来过\")\n"}, "lists": [], "check": "ok"}, "gb-clock-pieces": {"id": "智59", "slug": "gb-clock-pieces", "title": "钟面摔成三块，每块上数字之和相等", "diff": "EASY", "tags": [], "method": "数列求和", "kind": "puzzle", "note": "【题目】一个钟面（1 到 12）摔成三块，三块上数字之和相同。每块分别是哪些数？\n【答案】{11, 12, 1, 2}、{3, 4, 9, 10}、{5, 6, 7, 8}，每块和都是 26。\n【思路】1. 1 + 2 + … + 12 = 78，三等分每块 26。\n【思路】2. 要用到“首尾配对”：11+2、12+1、10+3、9+4 都是 13，两对凑成 26；5+6+7+8 = 26 正好是一段连续的数。\n【注意】{3, 4, 9, 10} 在钟面上并不相邻，所以这道题的“块”不要求是连续的一段弧；如果要求每块连续，则无解（代码里一并验证）。\n【面试这样说】“总和 78，每块 26，利用首尾配对和为 13 来凑。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "nums = list(range(1, 13))\nassert sum(nums) == 78\nsols = set()\nfor i in range(12):\n    for j in range(i + 1, i + 12):\n        for k in range(j + 1, i + 12):\n            arcs = [[nums[t % 12] for t in range(a, b)] for a, b in ((i, j), (j, k), (k, i + 12))]\n            if all(sum(a) == 26 for a in arcs):\n                sols.add(tuple(sorted(tuple(sorted(a)) for a in arcs)))\nassert not sols                                  # 要求连续弧时无解\nparts = [{11, 12, 1, 2}, {3, 4, 9, 10}, {5, 6, 7, 8}]\nassert set().union(*parts) == set(nums) and all(sum(p) == 26 for p in parts)\nprint(\"三块和都是 26\")\n"}, "lists": [], "check": "ok"}, "gb-socks": {"id": "智60", "slug": "gb-socks", "title": "三种颜色的袜子，最少拿几只一定能配成一双", "diff": "EASY", "tags": [], "method": "鸽笼原理", "kind": "puzzle", "note": "【题目】抽屉里有黄、绿、红三种颜色的袜子，每种都很多。闭着眼拿，最少拿几只能保证有一双同色？\n【答案】4 只。\n【思路】3 种颜色是 3 个“笼子”，拿 4 只放进 3 个笼子，至少有一个笼子里有 2 只。拿 3 只可能恰好三种颜色各一只。\n【面试这样说】“鸽笼原理：颜色数加 1。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from itertools import product\nassert any(len(set(c)) == 3 for c in product(\"YGR\", repeat=3))     # 3 只可能配不成\nassert all(len(set(c)) < 4 for c in product(\"YGR\", repeat=4))      # 4 只一定有重复\nprint(\"最少 4 只\")\n"}, "lists": [], "check": "ok"}, "gb-handshake-same": {"id": "智61", "slug": "gb-handshake-same", "title": "聚会上一定有两个人握手次数相同", "diff": "MEDIUM", "tags": [], "method": "鸽笼原理", "kind": "puzzle", "note": "【题目】n 个人（n ≥ 2）参加聚会，任意两人最多握一次手。证明一定有两个人握手的次数相同。\n【答案】一定有。\n【思路】1. 每个人的握手次数在 0 到 n − 1 之间，共 n 个可能值，看起来正好够 n 个人各不相同。\n【思路】2. 但 0 和 n − 1 不能同时出现：有人和所有人都握过手，就不可能有人一次都没握。\n【思路】3. 所以实际可能的值最多 n − 1 种，n 个人放进 n − 1 个笼子，必有两人相同。\n【面试这样说】“取值范围 0 到 n−1，但 0 和 n−1 互斥，只剩 n−1 种，鸽笼原理。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from itertools import combinations\nimport random\nfor n in range(2, 9):\n    edges = list(combinations(range(n), 2))\n    for _ in range(3000):\n        deg = [0] * n\n        for a, b in edges:\n            if random.random() < 0.5:\n                deg[a] += 1; deg[b] += 1\n        assert len(set(deg)) < n\nprint(\"总有两人握手次数相同\")\n"}, "lists": [], "check": "ok"}, "gb-ramsey-six": {"id": "智62", "slug": "gb-ramsey-six", "title": "6 个人中一定有 3 人互相认识或 3 人互不认识", "diff": "MEDIUM", "tags": [], "method": "鸽笼原理", "kind": "puzzle", "note": "【题目】任意 6 个人，证明其中一定有 3 个人两两认识，或者 3 个人两两不认识。\n【答案】一定有（拉姆齐数 R(3,3) = 6）。\n【思路】1. 任取一人 A，其余 5 人按“认识 A / 不认识 A”分两组，必有一组至少 3 人（鸽笼原理）。\n【思路】2. 设 B、C、D 都认识 A。如果 B、C、D 中有两人认识，他们和 A 构成三人互相认识；如果 B、C、D 两两都不认识，他们就是三人互不认识。另一组同理。\n【追问】5 个人不够：五个人围成一圈，只认识左右两个邻居，就既没有 3 人互相认识，也没有 3 人互不认识。\n【面试这样说】“固定一个人，5 条关系里必有 3 条同色，再看这 3 人之间的关系。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from itertools import combinations, product\ndef has_mono_triangle(n, color):\n    return any(color[(a, b)] == color[(a, c)] == color[(b, c)] for a, b, c in combinations(range(n), 3))\nE6 = list(combinations(range(6), 2))\nassert all(has_mono_triangle(6, dict(zip(E6, bits))) for bits in product((0, 1), repeat=15))\nE5 = list(combinations(range(5), 2))\npentagon = {e: int((e[1] - e[0]) % 5 in (1, 4)) for e in E5}\nassert not has_mono_triangle(5, pentagon)\nprint(\"6 人一定有，5 人不一定\")\n"}, "lists": [], "check": "ok"}, "gb-ants-square": {"id": "智63", "slug": "gb-ants-square", "title": "单位正方形里 51 只蚂蚁，半径 1/7 的瓶子能否盖住 3 只", "diff": "MEDIUM", "tags": [], "method": "鸽笼原理", "kind": "puzzle", "note": "【题目】边长为 1 的正方形里有 51 只蚂蚁。证明可以用一个半径为 1/7 的圆形瓶盖盖住至少 3 只。\n【答案】可以。\n【思路】1. 把正方形分成 5 × 5 = 25 个边长 1/5 的小正方形。51 只蚂蚁放进 25 格，至少一格有 3 只（25 × 2 = 50 < 51）。\n【思路】2. 边长 1/5 的小正方形的外接圆半径是 √2/10 ≈ 0.1414，小于 1/7 ≈ 0.1429，所以一个瓶盖能盖住整个小正方形。\n【面试这样说】“分成 25 格，51 只必有一格有 3 只，再检查小格的外接圆半径小于 1/7。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import math\nassert 51 > 25 * 2\nassert math.sqrt(2) / 10 < 1 / 7\nprint(\"外接圆半径\", round(math.sqrt(2) / 10, 4), \"< 1/7 =\", round(1 / 7, 4))\n"}, "lists": [], "check": "ok"}, "gb-fake-coins-ternary": {"id": "智64", "slug": "gb-fake-coins-ternary", "title": "5 袋硬币每袋 9g/10g/11g 之一，称一次全部判断", "diff": "HARD", "tags": [], "method": "鸽笼原理", "kind": "puzzle", "note": "【题目】5 个袋子，每袋 100 枚硬币。同一袋里的硬币重量相同，但每袋可能是 9 克、10 克或 11 克。用一台显示读数的秤，最少称几次能知道每袋是哪种？\n【答案】1 次：从 5 袋中分别取 1、3、9、27、81 枚一起称。\n【思路】1. 每袋相对 10 克的偏差是 −1、0、+1，正好是平衡三进制的一位数字。\n【思路】2. 总重 − 10 × 121 = d1·1 + d2·3 + d3·9 + d4·27 + d5·81，平衡三进制的表示是唯一的，所以能一次读出每一袋的偏差。\n【思路】3. 共 3^5 = 243 种情况，读数各不相同；每袋最多取 81 枚，不超过 100 枚，硬币够用。\n【面试这样说】“偏差只有 −1/0/+1，按 3 的幂取硬币，读数就是一个平衡三进制数。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from itertools import product\nw = [1, 3, 9, 27, 81]\nseen = {}\nfor d in product((-1, 0, 1), repeat=5):\n    s = sum(a * b for a, b in zip(d, w))\n    assert s not in seen\n    seen[s] = d\nassert len(seen) == 243 and max(w) <= 100\nprint(\"243 种情况一次称量即可区分\")\n"}, "lists": [], "check": "ok"}, "gb-divisible-9": {"id": "智65", "slug": "gb-divisible-9", "title": "各位数字之和能被 9 整除，这个数也能被 9 整除", "diff": "EASY", "tags": [], "method": "取余运算", "kind": "puzzle", "note": "【题目】证明：一个整数的各位数字之和能被 9 整除，当且仅当这个数能被 9 整除。\n【答案】因为 10 ≡ 1 (mod 9)。\n【思路】1. 设 N = Σ a_k · 10^k。10^k − 1 = 99…9 能被 9 整除，所以 10^k ≡ 1 (mod 9)。\n【思路】2. 于是 N ≡ Σ a_k (mod 9)，数和数字之和模 9 同余。\n【追问】11 的判别：10 ≡ −1 (mod 11)，所以奇数位之和减偶数位之和能被 11 整除，原数就能被 11 整除。\n【面试这样说】“10 模 9 余 1，所以数和数字和模 9 同余；同理 10 模 11 余 −1，得到 11 的交错和判别法。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "for n in range(1, 200000):\n    ds = sum(map(int, str(n)))\n    assert (n % 9 == 0) == (ds % 9 == 0)\n    alt = sum(int(c) * (-1) ** i for i, c in enumerate(reversed(str(n))))\n    assert (n % 11 == 0) == (alt % 11 == 0)\nprint(\"9 和 11 的判别法成立\")\n"}, "lists": [], "check": "ok"}, "gb-chameleons": {"id": "智66", "slug": "gb-chameleons", "title": "13 红 15 绿 17 蓝的变色龙能否变成同一种颜色", "diff": "MEDIUM", "tags": [], "method": "取余运算", "kind": "puzzle", "note": "【题目】岛上有 13 只红、15 只绿、17 只蓝变色龙。两只不同颜色的相遇，会同时变成第三种颜色。最后能否全部变成同一种颜色？\n【答案】不能。\n【思路】1. 一次相遇，比如红绿相遇：红 −1、绿 −1、蓝 +2。任意两种颜色数量之差的变化只能是 0 或 ±3。\n【思路】2. 所以两两之差模 3 不变。初始 (13, 15, 17) 的差是 2、2、4，模 3 都不为 0。\n【思路】3. 全部同色时是 (45, 0, 0)，有两种颜色之差为 0，模 3 为 0，矛盾。\n【面试这样说】“找模 3 的不变量：两两数量之差模 3 不变，初始都不为 0，到不了某两种都为 0 的状态。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from collections import deque\nstart = (13, 15, 17)\nseen = {start}; q = deque([start])\nwhile q:\n    s = q.popleft()\n    for i in range(3):\n        for j in range(i + 1, 3):\n            if s[i] and s[j]:\n                t = list(s); t[i] -= 1; t[j] -= 1; t[3 - i - j] += 2\n                t = tuple(t)\n                if t not in seen:\n                    seen.add(t); q.append(t)\nassert not any(sorted(s)[:2] == [0, 0] for s in seen)\nprint(\"可达状态\", len(seen), \"个，没有全同色\")\n"}, "lists": [], "check": "ok"}, "gb-coin-split-sum": {"id": "智67", "slug": "gb-coin-split-sum", "title": "1000 枚硬币反复分堆，乘积之和是多少", "diff": "MEDIUM", "tags": [], "method": "数学归纳法", "kind": "puzzle", "note": "【题目】一堆 1000 枚硬币。每次把某一堆分成两堆（a 枚和 b 枚），记下 a × b。一直分到每堆只有 1 枚，所有乘积之和是多少？和分法有关吗？\n【答案】总是 1000 × 999 / 2 = 499500，和分法无关。\n【思路】1. 猜 f(n) = n(n − 1)/2，也就是 n 个硬币两两配对的对数。\n【思路】2. 归纳：分成 a 和 b（a + b = n），f(n) = a·b + f(a) + f(b) = ab + a(a−1)/2 + b(b−1)/2 = (a+b)(a+b−1)/2。\n【直觉】每次分堆时 a·b 就是被“拆开”的硬币对数，每一对硬币恰好在某一次被拆开一次，所以总和就是对数。\n【面试这样说】“乘积之和等于被拆开的硬币对数，每对恰好被拆一次，所以是 C(n,2)。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\ndef split_sum(n):\n    piles, total = [n], 0\n    while any(p > 1 for p in piles):\n        i = random.choice([k for k, p in enumerate(piles) if p > 1])\n        p = piles.pop(i); a = random.randint(1, p - 1)\n        total += a * (p - a); piles += [a, p - a]\n    return total\nfor _ in range(50):\n    assert split_sum(1000) == 499500\nprint(\"总和恒为 499500\")\n"}, "lists": [], "check": "ok"}, "gb-chocolate": {"id": "智68", "slug": "gb-chocolate", "title": "6×8 的巧克力掰成 48 小块最少几次", "diff": "EASY", "tags": [], "method": "数学归纳法", "kind": "puzzle", "note": "【题目】一块 6 × 8 的巧克力，每次只能把一块沿格线掰成两块（不能叠起来一起掰）。掰成 48 个 1 × 1 的小块最少要几次？\n【答案】47 次，而且怎么掰都是 47 次。\n【思路】每掰一次，块数恰好加 1。从 1 块变成 48 块，需要 47 次。\n【面试这样说】“每次掰断块数加一，从 1 到 mn 需要 mn − 1 次，和顺序无关。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\ndef breaks(m, n):\n    pieces, cnt = [(m, n)], 0\n    while any(a * b > 1 for a, b in pieces):\n        i = random.choice([k for k, (a, b) in enumerate(pieces) if a * b > 1])\n        a, b = pieces.pop(i)\n        if a > 1 and (b == 1 or random.random() < 0.5):\n            c = random.randint(1, a - 1); pieces += [(c, b), (a - c, b)]\n        else:\n            c = random.randint(1, b - 1); pieces += [(a, c), (a, b - c)]\n        cnt += 1\n    return cnt\nassert all(breaks(6, 8) == 47 for _ in range(200))\nprint(\"恒为 47 次\")\n"}, "lists": [], "check": "ok"}, "gb-gas-station": {"id": "智69", "slug": "gb-gas-station", "title": "环形路上的加油站，从哪里出发能跑完一圈", "diff": "MEDIUM", "tags": [], "method": "数学归纳法", "kind": "puzzle", "note": "【题目】环形路上有 N 个加油站，第 i 站可加油 g[i]，从第 i 站到下一站要耗油 c[i]，所有站的油加起来刚好够跑一圈（Σg ≥ Σc）。油箱一开始是空的，证明一定存在一个出发点能跑完一圈，并找出它。（LeetCode 134）\n【答案】从“累计油量 Σ(g − c) 最低点”的下一站出发。\n【思路】1. 从 0 号站开始记录前缀和 S_k = Σ_{i<k} (g[i] − c[i])。设它在第 k 站取到最小值。\n【思路】2. 从第 k 站出发，路上任意时刻的油量都等于 S_j − S_k ≥ 0（因为 S_k 最小），绕过一圈后加上的总量 Σ(g − c) ≥ 0，也不会为负。\n【思路】3. 一次遍历即可：油量一旦为负就把起点改到下一站。\n【面试这样说】“看前缀和曲线，从最低点出发，之后的累计油量都不会低于起点，所以能跑完。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "import random\ndef greedy(g, c):\n    start = tank = 0\n    for i in range(len(g)):\n        tank += g[i] - c[i]\n        if tank < 0:\n            start, tank = i + 1, 0\n    return start\ndef ok(g, c, s):\n    tank = 0\n    for t in range(len(g)):\n        i = (s + t) % len(g); tank += g[i] - c[i]\n        if tank < 0: return False\n    return True\nfor _ in range(3000):\n    n = random.randint(1, 8)\n    g = [random.randint(0, 9) for _ in range(n)]; c = [random.randint(0, 9) for _ in range(n)]\n    if sum(g) >= sum(c):\n        assert ok(g, c, greedy(g, c))\nprint(\"贪心起点总能跑完\")\n"}, "lists": [], "check": "ok"}, "gb-sqrt2-irrational": {"id": "智70", "slug": "gb-sqrt2-irrational", "title": "证明 √2 是无理数", "diff": "EASY", "tags": [], "method": "反证法", "kind": "puzzle", "note": "【题目】证明 √2 不是有理数。\n【答案】反证法。\n【思路】1. 假设 √2 = a/b，a、b 是正整数且互质。\n【思路】2. 两边平方得 a² = 2b²，所以 a² 是偶数，a 是偶数，设 a = 2c。\n【思路】3. 代入得 4c² = 2b²，即 b² = 2c²，所以 b 也是偶数。a、b 都是偶数，和互质矛盾。\n【面试这样说】“假设是最简分数，推出分子分母都是偶数，矛盾。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from math import isqrt\nassert not any(isqrt(2 * b * b) ** 2 == 2 * b * b for b in range(1, 10**6))\nprint(\"b ≤ 10^6 内不存在 a² = 2b²（代码只是演示，证明靠反证法）\")\n"}, "lists": [], "check": "ok"}, "gb-rainbow-hats": {"id": "智71", "slug": "gb-rainbow-hats", "title": "7 个囚犯戴 7 种颜色的帽子，保证至少一人猜对", "diff": "HARD", "tags": [], "method": "反证法", "kind": "puzzle", "note": "【题目】7 个囚犯编号 0–6，每人戴一顶帽子，颜色是 0–6 中的一种（可以重复）。每个人能看到别人的帽子，看不到自己的，同时写下自己帽子的颜色，不能交流。事先能否约定策略，保证至少一人猜对？\n【答案】能。第 i 号囚犯假设“所有帽子颜色之和 mod 7 = i”，据此算出自己的颜色：g_i = (i − 他看到的其他人颜色之和) mod 7。\n【思路】1. 设真实的颜色总和 mod 7 = s，s 一定是 0–6 中的某个数。\n【思路】2. 第 s 号囚犯的假设恰好成立，所以他一定猜对。（用反证法：如果全错，s 就不能等于 0–6 中的任何一个，矛盾。）\n【追问】这个策略恰好让一个人猜对，期望猜对人数仍是 1，策略只是把“猜对”均匀分摊成“一定有一个”。\n【面试这样说】“每人负责总和模 7 的一个余数，真实余数一定落在某人身上，他一定对。”\n【出处】Zhou《A Practical Guide to Quantitative Finance Interviews》（绿皮书）第 2 章", "sub": {"ts": 0, "lang": "python3", "runtime": "", "memory": "", "code": "from itertools import product\nN = 7\nfor hats in product(range(N), repeat=N):\n    total = sum(hats)\n    correct = sum((i - (total - hats[i])) % N == hats[i] for i in range(N))\n    assert correct == 1\nprint(\"7^7 种情况下恰好一人猜对\")\n"}, "lists": [], "check": "ok"}}, "lists": [{"key": "all", "name": "全部", "slugs": ["two-sum", "group-anagrams", "longest-consecutive-sequence", "move-zeroes", "container-with-most-water", "3sum", "trapping-rain-water", "longest-substring-without-repeating-characters", "find-all-anagrams-in-a-string", "subarray-sum-equals-k", "sliding-window-maximum", "minimum-window-substring", "maximum-subarray", "merge-intervals", "rotate-array", "product-of-array-except-self", "first-missing-positive", "set-matrix-zeroes", "spiral-matrix", "rotate-image", "search-a-2d-matrix-ii", "intersection-of-two-linked-lists", "reverse-linked-list", "palindrome-linked-list", "linked-list-cycle", "linked-list-cycle-ii", "merge-two-sorted-lists", "add-two-numbers", "remove-nth-node-from-end-of-list", "swap-nodes-in-pairs", "reverse-nodes-in-k-group", "copy-list-with-random-pointer", "sort-list", "merge-k-sorted-lists", "lru-cache", "binary-tree-inorder-traversal", "maximum-depth-of-binary-tree", "invert-binary-tree", "symmetric-tree", "diameter-of-binary-tree", "binary-tree-level-order-traversal", "convert-sorted-array-to-binary-search-tree", "validate-binary-search-tree", "kth-smallest-element-in-a-bst", "binary-tree-right-side-view", "flatten-binary-tree-to-linked-list", "construct-binary-tree-from-preorder-and-inorder-traversal", "path-sum-iii", "lowest-common-ancestor-of-a-binary-tree", "binary-tree-maximum-path-sum", "number-of-islands", "rotting-oranges", "course-schedule", "implement-trie-prefix-tree", "permutations", "subsets", "letter-combinations-of-a-phone-number", "combination-sum", "generate-parentheses", "word-search", "palindrome-partitioning", "n-queens", "search-insert-position", "search-a-2d-matrix", "find-first-and-last-position-of-element-in-sorted-array", " $("out").onclick = e => { const b = e.target.closest(".q"); if (b) location.hash = b.dataset.s; };
$("back").onclick = () => { location.hash = ""; closeQ(); };
$("prev").onclick = $("next").onclick = e => { if (e.currentTarget.dataset.s) location.hash = e.currentTarget.dataset.s; };
$("copy").onclick = () => {
  const t = $("s-code").textContent;
  const sel = () => { const r = document.createRange(); r.selectNodeContents($("s-code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("copy").textContent = "已选中，手动复制"; };
  try { navigator.clipboard.writeText(t).then(() => $("copy").textContent = "已复制", sel); } catch (e) { sel(); }
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) { location.hash = ""; closeQ(); } });
window.addEventListener("hashchange", syncHash);

renderControls(); renderList(); syncHash();
</script>

</body>
</html>
